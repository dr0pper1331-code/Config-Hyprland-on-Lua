# ——————————————————————————————————————————————————————————————————
# 1. FONTS & TYPOGRAPHY
# ——————————————————————————————————————————————————————————————————
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Внимание: adjust_line_height принимает пиксели или проценты в кавычках
modify_font line_height 110%
disable_ligatures   cursor

# ——————————————————————————————————————————————————————————————————
# 2. WINDOW & LAYOUT MANAGEMENT
# ——————————————————————————————————————————————————————————————————
window_margin_width  0
window_padding_width 8

hide_window_decorations yes
remember_window_size    no
initial_window_width    960
initial_window_height   600

# Порядок изменен на "splits,stack" для работы кастомных комбинаций
enabled_layouts splits,stack
# active_border_color   #00ffc8
# inactive_border_color #444444
window_border_width   1pt

# ——————————————————————————————————————————————————————————————————
# 3. TAB BAR STYLING
# ——————————————————————————————————————————————————————————————————
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_margin_width    0.0
# Внимание: tab_bar_margin_height принимает только ОДНО числовое значение
tab_bar_margin_height   0.0
active_tab_font_style   bold
inactive_tab_font_style normal

# ——————————————————————————————————————————————————————————————————
# 4. PERFORMANCE & CURSOR BEHAVIOR
# ——————————————————————————————————————————————————————————————————
enable_audio_bell    no
visual_bell_duration 0.0

cursor_shape          beam
cursor_trail          3
cursor_trail_decay    0.1 0.4
scrollback_lines      10000

# ——————————————————————————————————————————————————————————————————
# 5. CUSTOM KEYBINDINGS
# ——————————————————————————————————————————————————————————————————
# Внимание: убран флаг --cwd=current, так как launch открывает текущую директорию по умолчанию
map alt+enter       launch --location=vsplit
map alt+shift+enter launch --location=hsplit

map alt+h neighboring_window left
map alt+l neighboring_window right
map alt+k neighboring_window up
map alt+j neighboring_window down

map alt+z toggle_layout stack

# Открытие новой вкладки в текущей рабочей директории
map alt+t new_tab

map alt+w close_window
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4

map ctrl+shift+r load_config_file

shell /bin/zsh


# BEGIN_KITTY_THEME
# Nordfox
include current-theme.conf
# END_KITTY_THEME
